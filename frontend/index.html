<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254f43">
  <title>Insieme · La nostra famiglia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#screen">Vai al contenuto</a>
  <aside>
    <a class="brand" href="#oggi">insieme<span>LA NOSTRA FAMIGLIA</span></a>
    <nav aria-label="Navigazione principale" id="nav"></nav>
    <div class="aside-note">Un posto per tutto.<br>Più spazio per voi.</div>
  </aside>
  <main>
    <header>
      <div>
        <span id="date"></span>
        <span id="sync" class="sync"></span>
      </div>
      <button id="add" class="primary" type="button">＋ Aggiungi</button>
      <a id="more" href="#altro" aria-label="Altro: famiglia e impostazioni">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </a>
    </header>
    <div id="legacy-banner" class="banner" hidden>
      <span>Su questo dispositivo ci sono dati della prima versione, non ancora condivisi.</span>
      <button type="button" id="legacy-import" class="primary">Importali</button>
      <button type="button" id="legacy-dismiss">Ignora</button>
    </div>
    <section id="screen" tabindex="-1"></section>
    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
  <nav id="tabbar" aria-label="Navigazione rapida"></nav>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="entry" novalidate>
      <div class="section-head">
        <h2 id="editor-title">Nuovo appuntamento</h2>
        <button type="button" data-close aria-label="Chiudi senza salvare">Chiudi</button>
      </div>
      <fieldset class="segmented">
        <legend>Tipo</legend>
        <label><input type="radio" name="type" value="event" checked><span>Appuntamento</span></label>
        <label><input type="radio" name="type" value="task"><span>Attività</span></label>
        <label><input type="radio" name="type" value="shopping"><span>Spesa</span></label>
        <label><input type="radio" name="type" value="bill"><span>Costo</span></label>
      </fieldset>
      <label><span id="title-label">Cosa?</span><input name="title" required maxlength="180"></label>
      <div class="fields" data-for="event">
        <label><span>Data</span><input name="date" type="date"></label>
        <label class="setting-check inline"><input type="checkbox" name="all_day">Tutto il giorno</label>
        <label data-timed><span>Inizio</span><input name="start" type="time"></label>
        <label data-timed><span>Fine (facoltativa)</span><input name="end" type="time"></label>
      </div>
      <div data-for="task">
        <label><span>Scadenza (facoltativa)</span><input name="due_date" type="date"></label>
        <label><span>Promemoria (facoltativo)</span><input name="remind_at" type="datetime-local"></label>
        <label><span>Ripeti</span><select name="repeat">
          <option value="">Non ripetere</option><option value="daily">Ogni giorno</option>
          <option value="weekly">Ogni settimana</option><option value="monthly">Ogni mese</option>
        </select></label>
      </div>
      <div data-for="shopping">
        <label><span>Quantità</span><input name="quantity" maxlength="40" placeholder="Es. 2 confezioni"></label>
      </div>
      <div class="fields" data-for="bill">
        <label><span>Categoria</span><select name="category"></select></label>
        <label><span>Fornitore (facoltativo)</span><input name="supplier" maxlength="180" placeholder="Es. Octopus Energy"></label>
        <label><span>Importo in € (facoltativo)</span><input name="amount" type="number" step="0.01" min="0" inputmode="decimal"></label>
        <label><span>Scadenza (facoltativa)</span><input name="bill_due" type="date"></label>
      </div>
      <div class="fields" data-for="event task">
        <label><span>Chi se ne occupa</span><select name="member_id"></select></label>
        <label data-for="event"><span>Luogo</span><input name="location" maxlength="300" placeholder="Es. piscina comunale"></label>
      </div>
      <div data-for="event task">
        <label><span>Note</span><textarea name="notes" rows="3" maxlength="2000"></textarea></label>
      </div>
      <p class="hint" data-for="event">Ricorrenze e promemoria automatici arriveranno nelle prossime versioni.</p>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="editor-delete" class="danger" hidden>Elimina</button>
        <button type="submit" class="primary">Salva</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
