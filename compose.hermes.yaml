# Overlay opzionale: due istanze Hermes indipendenti, senza porte pubblicate sul NAS.
services:
  hermes-chat:
    image: nousresearch/hermes-agent:v2026.7.20
    container_name: HERMES-PERSONALE-CHAT
    command: ["gateway", "run"]
    restart: unless-stopped
    profiles: [integrations]
    env_file: .env.hermes-chat
    volumes:
      - ./hermes-chat-data:/opt/data
  hermes-email:
    image: nousresearch/hermes-agent:v2026.7.20
    container_name: HERMES-PERSONALE-EMAIL
    command: ["gateway", "run"]
    restart: unless-stopped
    profiles: [integrations]
    env_file: .env.hermes-email
    volumes:
      - ./hermes-email-data:/opt/data
  worker:
    depends_on:
      api:
        condition: service_healthy
      hermes-chat:
        condition: service_started
      hermes-email:
        condition: service_started
