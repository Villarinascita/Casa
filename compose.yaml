# Progetto personale: nomi distinti dai container di lavoro (hermes, N8N-LAVORO, ...).
name: insieme-personale
services:
  api:
    build: .
    image: insieme-personale:local
    container_name: INSIEME-PERSONALE-API
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/data
    ports:
      - "127.0.0.1:4173:4173"
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 4173"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
  worker:
    image: insieme-personale:local
    container_name: INSIEME-PERSONALE-WORKER
    restart: unless-stopped
    profiles: [integrations]
    env_file: .env
    volumes:
      - ./data:/srv/data
    command: [".venv/bin/python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: CLOUDFLARE-PERSONALE-INSIEME
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
networks:
  default:
    name: NET.PERSONALE
