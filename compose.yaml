services:
  api:
    build: .
    image: insieme:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/data
    ports:
      - "127.0.0.1:4173:4173"
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 4173"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
  worker:
    image: insieme:local
    restart: unless-stopped
    profiles: [integrations]
    env_file: .env
    volumes:
      - ./data:/srv/data
    command: [".venv/bin/python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
