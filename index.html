<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254f43"><title>Insieme · La nostra famiglia</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body><aside><a class="brand" href="#oggi">insieme<span>LA NOSTRA FAMIGLIA</span></a><nav aria-label="Navigazione principale" id="nav"></nav><div class="aside-note">Un posto per tutto.<br>Più spazio per voi.</div></aside><main><header><span id="date"></span><button id="add" class="primary">＋ Aggiungi</button></header><div class="local-note">Prima versione · dati salvati solo su questo dispositivo</div><section id="screen"></section><section id="editor" hidden aria-label="Inserimento"><div class="section-head"><h2>Aggiungiamo un impegno</h2><button id="close" aria-label="Chiudi inserimento">Chiudi</button></div><form id="entry"><label>Tipo<select name="type"><option value="event">Appuntamento</option><option value="task">Attività</option><option value="shopping">Spesa</option></select></label><label>Cosa vuoi ricordare?<input name="title" required maxlength="180" placeholder="Es. Nuoto, chiamare il tecnico, latte"></label><div class="fields"><label>Data<input name="date" type="date"></label><label>Ora<input name="time" type="time"></label><label>Persona<select name="person" id="people"></select></label><label>Luogo o dettagli<input name="note" maxlength="300" placeholder="Es. piscina comunale"></label></div><p class="hint">Gli appuntamenti richiedono data e ora. Ricorrenze e avvisi automatici arriveranno nelle prossime versioni.</p><button class="primary" type="submit">Salva</button><p id="form-error" role="alert"></p></form></section><p id="status" role="status" aria-live="polite"></p></main><script src="app.js" defer></script></body></html>
